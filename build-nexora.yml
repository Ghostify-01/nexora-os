            # ── Create NEXORA user via customize_airootfs ─────────────────
            cat > \"\${PROFILE_DIR}/airootfs/root/customize_airootfs.sh\" << 'CUSTEOF'
#!/usr/bin/env bash
set -euo pipefail

# Create nexora user (password: NEXORA)
useradd -m -G wheel,audio,video,storage,optical,network,power -s /bin/bash nexora
echo 'nexora:NEXORA' | chpasswd
echo 'root:NEXORA' | chpasswd

# Sudoers: no password for wheel
echo '%wheel ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

# Enable services
systemctl enable NetworkManager
systemctl enable sddm
systemctl enable waydroid-container

# Waydroid init (deferred to first boot)
cat > /etc/nexora/waydroid-init.sh << 'WEOF'
#!/bin/bash
if [ ! -f /var/lib/waydroid/.initialized ]; then
  waydroid init -s GAPPS -f
  touch /var/lib/waydroid/.initialized
fi
WEOF
chmod +x /etc/nexora/waydroid-init.sh

# Locale & timezone defaults
echo 'LANG=en_US.UTF-8' > /etc/locale.conf
echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
locale-gen
ln -sf /usr/share/zoneinfo/UTC /etc/localtime

echo 'nexora' > /etc/hostname
CUSTEOF
            chmod +x \"\${PROFILE_DIR}/airootfs/root/customize_airootfs.sh\"

            # ── nexora-sysinfo: System Information Tool ───────────────────
            cat > \"\${PROFILE_DIR}/airootfs/usr/local/bin/nexora-sysinfo\" << 'SIEOF'
#!/usr/bin/env bash
# Nexora System Info + Game Recommender
# Uses Python + Qt via kdialog or a terminal UI

python3 << 'PYEOF'
import subprocess, json, os, sys

def run(cmd):
    try:
        return subprocess.check_output(cmd, shell=True, stderr=subprocess.DEVNULL).decode().strip()
    except:
        return \"Unknown\"

# ── Hardware detection ────────────────────────────────────────────────────
cpu      = run(\"grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2\").strip()
cores    = run(\"nproc\")
ram_kb   = int(run(\"grep MemTotal /proc/meminfo | awk '{print \$2}'\") or 0)
ram_gb   = round(ram_kb / 1024 / 1024, 1)
gpu      = run(\"lspci | grep -i 'vga\\|3d\\|display' | cut -d: -f3\").strip()
disk     = run(\"lsblk -d -o NAME,SIZE,MODEL | grep -v loop | tail -n +2\")
arch_cpu = run(\"uname -m\")
kernel   = run(\"uname -r\")
hostname = run(\"hostname\")
uptime_s = run(\"uptime -p\")
board    = run(\"dmidecode -s baseboard-product-name 2>/dev/null || echo 'Unknown'\")
bios     = run(\"dmidecode -s bios-version 2>/dev/null || echo 'Unknown'\")
vram     = run(\"lspci -v 2>/dev/null | grep -A 10 'VGA' | grep 'prefetchable' | head -1 | awk '{print \$NF}'\") or \"Unknown\"
net      = run(\"ip link | grep -E '^[0-9]' | awk '{print \$2}' | tr '\\\\n' ' '\")
res      = run(\"xrandr 2>/dev/null | grep '*' | awk '{print \$1}' | head -1\") or run(\"wlr-randr 2>/dev/null | grep 'current' | head -1\") or \"Unknown\"
storage_free = run(\"df -h / | tail -1 | awk '{print \$4}'\")
storage_total = run(\"df -h / | tail -1 | awk '{print \$2}'\")

info = f\"\"\"
╔══════════════════════════════════════════════════════════════╗
║              NEXORA OS — SYSTEM INFORMATION                  ║
╠══════════════════════════════════════════════════════════════╣
║  Hostname   : {hostname:<44} ║
║  Kernel     : {kernel:<44} ║
║  Uptime     : {uptime_s:<44} ║
╠══════════════════════════════════════════════════════════════╣
║  CPU        : {cpu[:44]:<44} ║
║  CPU Cores  : {cores:<44} ║
║  RAM        : {str(ram_gb)+' GB':<44} ║
╠══════════════════════════════════════════════════════════════╣
║  GPU        : {gpu[:44]:<44} ║
║  VRAM       : {vram:<44} ║
║  Resolution : {res:<44} ║
╠══════════════════════════════════════════════════════════════╣
║  Motherboard: {board[:44]:<44} ║
║  BIOS/UEFI  : {bios[:44]:<44} ║
║  CPU Arch   : {arch_cpu:<44} ║
╠══════════════════════════════════════════════════════════════╣
║  Disk Total : {storage_total:<44} ║
║  Disk Free  : {storage_free:<44} ║
║  Disks      : {disk[:44]:<44} ║
║  Network    : {net[:44]:<44} ║
╚══════════════════════════════════════════════════════════════╝
\"\"\"

# ── Game tier recommendation based on RAM ────────────────────
if ram_gb >= 16:
    tier = \"HIGH-END\"
    games = [
        (\"Windows\",  [\"Cyberpunk 2077\",\"Elden Ring\",\"GTA V\",\"Red Dead Redemption 2\",\"Baldur's Gate 3\"]),
        (\"Linux\",    [\"Dota 2\",\"Counter-Strike 2\",\"Hollow Knight\",\"Celeste\",\"Stardew Valley\"]),
        (\"Android\",  [\"Genshin Impact\",\"PUBG Mobile\",\"Call of Duty Mobile\",\"Roblox\",\"Minecraft PE\"]),
    ]
elif ram_gb >= 8:
    tier = \"MID-RANGE\"
    games = [
        (\"Windows\",  [\"GTA V (Medium)\",\"The Witcher 3\",\"Minecraft\",\"Terraria\",\"Among Us\"]),
        (\"Linux\",    [\"CS2 (Low)\",\"Stardew Valley\",\"OpenTTD\",\"0 A.D.\",\"SuperTuxKart\"]),
        (\"Android\",  [\"Clash of Clans\",\"Subway Surfers\",\"Candy Crush\",\"Asphalt 9\",\"Free Fire\"]),
    ]
elif ram_gb >= 4:
    tier = \"LOW-END\"
    games = [
        (\"Windows\",  [\"Minecraft (Low)\",\"Among Us\",\"Terraria\",\"Undertale\",\"Stardew Valley\"]),
        (\"Linux\",    [\"SuperTuxKart\",\"0 A.D.\",\"FreeCiv\",\"Xonotic\",\"Minetest\"]),
        (\"Android\",  [\"Subway Surfers\",\"Candy Crush\",\"Temple Run\",\"Hill Climb Racing\",\"Angry Birds\"]),
    ]
else:
    tier = \"MINIMUM\"
    games = [
        (\"Linux\",    [\"Minetest\",\"FreeCiv\",\"2048\",\"Xonotic (Low)\",\"Supertux\"]),
        (\"Android\",  [\"2048\",\"Solitaire\",\"Snake\",\"Sudoku\",\"Chess\"]),
    ]

game_str = f\"\\n  System Tier: {tier}\\n\"
for platform, glist in games:
    game_str += f\"\\n  [{platform} Games]\\n\"
    for g in glist:
        game_str += f\"    ✦ {g}\\n\"

print(info)
print(\"╔══════════════════════════════════════════════════════════════╗\")
print(\"║           RECOMMENDED GAMES FOR YOUR SYSTEM                  ║\")
print(\"╚══════════════════════════════════════════════════════════════╝\")
print(game_str)
print(\"  Filter options: nexora-sysinfo --windows | --android | --linux\")
PYEOF
SIEOF
            chmod +x \"\${PROFILE_DIR}/airootfs/usr/local/bin/nexora-sysinfo\"

            # ── nexora-exe-handler: Run .exe files ────────────────────────
