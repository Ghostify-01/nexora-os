name: Build Nexora OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Arch Linux container (archiso needs Arch) ──────────────
      - name: Set up Arch Linux via Docker
        run: |
          docker pull archlinux:latest
          docker run --privileged --name nexora-builder \
            -v ${{ github.workspace }}:/workspace \
            -d archlinux:latest sleep infinity

      # ── 3. Install archiso and dependencies inside Arch container ─────────
      - name: Install build dependencies
        run: |
          docker exec nexora-builder bash -c "
            pacman -Syu --noconfirm
            pacman -S --noconfirm archiso git squashfs-tools libisoburn dosfstools
          "

      # ── 4. Run the Nexora build script inside the container ───────────────
      - name: Build Nexora OS ISO
        run: |
          docker exec nexora-builder bash -c "
            set -euo pipefail

            BUILD_DIR='/var/tmp/nexora_build'
            PROFILE_DIR='\${BUILD_DIR}/nexora_profile'
            OUT_DIR='/workspace/output'

            mkdir -p \"\${BUILD_DIR}\" \"\${OUT_DIR}\"

            # ── Copy releng base profile ──────────────────────────────────
            cp -r /usr/share/archiso/configs/releng/* \"\${PROFILE_DIR}/\"

            # ── profiledef.sh ─────────────────────────────────────────────
            cat > \"\${PROFILE_DIR}/profiledef.sh\" << 'PROFILEEOF'
#!/usr/bin/env bash
# shellcheck disable=SC2034
iso_name=\"nexora-os\"
iso_label=\"NEXORA_LIVE\"
iso_publisher=\"Nexora OS Project <https://github.com/nexora-os>\"
iso_application=\"Nexora Gaming and Unified OS\"
iso_version=\"\$(date +%Y.%m.%d)\"
install_dir=\"nexora\"
buildmodes=('iso')
bootmodes=('bios.syslinux.mbr' 'bios.syslinux.eltorito' 'uefi-ia32.systemd-boot.esp' 'uefi-x64.systemd-boot.esp')
arch=\"x86_64\"
pacman_conf=\"pacman.conf\"
airootfs_image_type=\"squashfs\"
airootfs_image_tool_options=('-comp' 'xz' '-Xbcj' 'x86' '-b' '1M' '-Xdict-size' '1M')
file_permissions=(
  [\"/etc/shadow\"]=\"0:0:400\"
  [\"/root\"]=\"0:0:750\"
  [\"/usr/local/bin/nexora-exe-handler\"]=\"0:0:755\"
  [\"/usr/local/bin/nexora-sysinfo\"]=\"0:0:755\"
  [\"/usr/local/bin/nexora-gamelauncher\"]=\"0:0:755\"
  [\"/usr/local/bin/nexora-store\"]=\"0:0:755\"
  [\"/usr/local/bin/nexora-installer\"]=\"0:0:755\"
)
PROFILEEOF
            chmod +x \"\${PROFILE_DIR}/profiledef.sh\"

            # ── pacman.conf: enable multilib ──────────────────────────────
            cat >> \"\${PROFILE_DIR}/pacman.conf\" << 'PACEOF'
[multilib]
Include = /etc/pacman.d/mirrorlist
PACEOF

