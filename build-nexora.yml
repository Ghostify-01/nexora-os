            # ── Create all airootfs directories ───────────────────────────
            mkdir -p \"\${PROFILE_DIR}/airootfs/usr/local/bin\"
            mkdir -p \"\${PROFILE_DIR}/airootfs/usr/share/applications\"
            mkdir -p \"\${PROFILE_DIR}/airootfs/etc/systemd/system\"
