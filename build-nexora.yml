            mkdir -p \"\${PROFILE_DIR}/airootfs/home/nexora/Desktop\"
            mkdir -p \"\${PROFILE_DIR}/airootfs/etc/nexora\"
            mkdir -p \"\${PROFILE_DIR}/airootfs/usr/share/nexora/wallpapers\"
