            cat > \"\${PROFILE_DIR}/airootfs/usr/share/nexora/wallpapers/nexora-default.svg\" << 'SVGEOF'
<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'>
  <defs>
    <radialGradient id='bg' cx='50%' cy='60%' r='80%'>
      <stop offset='0%' stop-color='#1a1a2e'/>
      <stop offset='50%' stop-color='#0d0d1a'/>
      <stop offset='100%' stop-color='#000000'/>
    </radialGradient>
  </defs>
  <rect width='1920' height='1080' fill='url(#bg)'/>
  <text x='960' y='200' font-family='monospace' font-size='80' fill='#ffffff'
    text-anchor='middle' opacity='0.08'>NEXORA OS</text>
  <text x='960' y='540' font-family='monospace' font-size='36' fill='#4fc3f7'
    text-anchor='middle' opacity='0.6'>NEXORA OS</text>
  <text x='960' y='600' font-family='monospace' font-size='16' fill='#90caf9'
    text-anchor='middle' opacity='0.4'>Gaming. Unified. Free.</text>
</svg>
SVGEOF

            # ── Plasma autostart: set wallpaper on first login ────────────
            mkdir -p \"\${PROFILE_DIR}/airootfs/home/nexora/.config/autostart\"
            cat > \"\${PROFILE_DIR}/airootfs/home/nexora/.config/autostart/nexora-setup.desktop\" << 'ASEOF'
[Desktop Entry]
Type=Application
Name=Nexora First Boot Setup
Exec=/etc/nexora/first-boot.sh
X-KDE-autostart-after=panel
ASEOF

            mkdir -p \"\${PROFILE_DIR}/airootfs/etc/nexora\"
            cat > \"\${PROFILE_DIR}/airootfs/etc/nexora/first-boot.sh\" << 'FBEOF'
#!/bin/bash
# Set AE86 wallpaper
plasma-apply-wallpaperimage /usr/share/nexora/wallpapers/nexora-default.svg 2>/dev/null || true
# Init Waydroid if not done
/etc/nexora/waydroid-init.sh &
# Show welcome
kdialog --title \"Welcome to Nexora OS\" --msgbox \"Welcome to Nexora OS!

Your system is ready. Use the desktop shortcuts to:
 Game Launcher — Play Windows, Linux & Android games
 Nexora Store  — Install apps from all platforms
 System Info   — See your hardware & game recommendations
 Install Nexora — Install to your drive

Auto-login is set. Username: NEXORA | Password: NEXORA\" 2>/dev/null || true
# Remove autostart after first run
rm -f ~/.config/autostart/nexora-setup.desktop
FBEOF
            chmod +x \"\${PROFILE_DIR}/airootfs/etc/nexora/first-boot.sh\"

            # ── Build the ISO ─────────────────────────────────────────────
            mkarchiso -v -w \"\${BUILD_DIR}/work\" -o \"\${OUT_DIR}\" \"\${PROFILE_DIR}\"
          "

      # ── 5. Upload ISO as artifact ─────────────────────────────────────────
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-os-iso
          path: output/nexora-os-*.iso
          retention-days: 7
          compression-level: 9
