            chmod +x \"\${PROFILE_DIR}/airootfs/usr/local/bin/nexora-store\"

            # ── nexora-installer: OS Installer ────────────────────────────
            cat > \"\${PROFILE_DIR}/airootfs/usr/local/bin/nexora-installer\" << 'INSTEOF'
#!/usr/bin/env bash
# Nexora OS Installer - Supports ext4, btrfs, exFAT, FAT32, NTFS

konsole -e bash << 'INNER'
set -euo pipefail

echo \"\"
echo \"  ╔══════════════════════════════════════════════════════╗\"
echo \"  ║          NEXORA OS INSTALLER v1.0                    ║\"
echo \"  ║  Minimum: 1GB RAM, 5GB Storage, 64-bit, 1024x768     ║\"
echo \"  ║  Recommended: 2GB RAM, 15GB Storage                  ║\"
echo \"  ╚══════════════════════════════════════════════════════╝\"
echo \"\"

# List disks
echo \"  Available disks:\"
lsblk -d -o NAME,SIZE,MODEL | grep -v loop
echo \"\"
read -p \"  Enter target disk (e.g. sda, nvme0n1): \" DISK
DISK=\"/dev/\${DISK}\"

echo \"\"
echo \"  Choose filesystem:\"
echo \"  [1] ext4    (Recommended - best Linux support)\"
echo \"  [2] btrfs   (Modern - snapshots, compression)\"
echo \"  [3] exFAT   (Compatible with Windows/Mac)\"
echo \"  [4] FAT32   (Maximum compatibility)\"
echo \"  [5] NTFS    (Windows compatible)\"
read -p \"  Choice: \" FSTYPE

case \$FSTYPE in
  1) FS=\"ext4\" ;;
  2) FS=\"btrfs\" ;;
  3) FS=\"exfat\" ;;
  4) FS=\"vfat\" ;;
  5) FS=\"ntfs\" ;;
  *) echo \"Invalid\"; exit 1 ;;
esac

echo \"\"
echo \"  ⚠  WARNING: This will ERASE all data on \${DISK}\"
read -p \"  Type YES to confirm: \" CONFIRM
[ \"\$CONFIRM\" != \"YES\" ] && echo \"Cancelled.\" && exit 0

echo \"  Partitioning \${DISK}...\"
parted -s \"\$DISK\" mklabel gpt
parted -s \"\$DISK\" mkpart ESP fat32 1MiB 512MiB
parted -s \"\$DISK\" set 1 esp on
parted -s \"\$DISK\" mkpart ROOT \"\$FS\" 512MiB 100%

# Format
EFI_PART=\"\${DISK}1\"
ROOT_PART=\"\${DISK}2\"

mkfs.fat -F32 \"\$EFI_PART\"

case \$FS in
  ext4)  mkfs.ext4 -L NEXORA \"\$ROOT_PART\" ;;
  btrfs) mkfs.btrfs -L NEXORA \"\$ROOT_PART\" ;;
  exfat) mkfs.exfat -n NEXORA \"\$ROOT_PART\" ;;
  vfat)  mkfs.fat -F32 -n NEXORA \"\$ROOT_PART\" ;;
  ntfs)  mkfs.ntfs -Q -L NEXORA \"\$ROOT_PART\" ;;
esac

echo \"  Mounting...\"
mount \"\$ROOT_PART\" /mnt
mkdir -p /mnt/boot/efi
mount \"\$EFI_PART\" /mnt/boot/efi

echo \"  Copying system files (this may take 10-20 minutes)...\"
rsync -aAX --exclude={'/dev/*','/proc/*','/sys/*','/tmp/*','/run/*','/mnt/*','/lost+found'} / /mnt/

echo \"  Installing bootloader...\"
arch-chroot /mnt grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=NEXORA
arch-chroot /mnt grub-mkconfig -o /boot/grub/grub.cfg

echo \"  Finalizing...\"
arch-chroot /mnt mkinitcpio -P
umount -R /mnt

echo \"\"
echo \"  ✓ Nexora OS installed successfully!\"
echo \"  ✓ Remove the USB and reboot.\"
read -p \"  Press Enter to exit...\"
INNER
INSTEOF
